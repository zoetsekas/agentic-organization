# docker/images.lock — tag-to-digest pins for every third-party image ADR-0053
# names. A tag moves; a digest is the thing that was reviewed (ADR-0053 rule 1),
# so the tags below are for humans and the digests are what deployment uses.
#
# FORMAT
#   One record per line:   <repository>:<tag><TAB or spaces><digest><TAB>plane
#   `#` starts a comment; blank lines are ignored.
#   <digest> is either `sha256:<64 hex>` or the literal token UNRESOLVED.
#
# UPDATE 2026-09-20: registry access turned out to be available through the
# egress proxy, so most of these were resolved for real against the registry's
# manifest API. Three did not resolve, and the reasons differ — read them:
#   * quay.io/keycloak/keycloak:26 — quay.io is blocked by the egress proxy.
#     Environmental; the tag was never checked either way.
#   * minio/minio — the Docker Hub repository serves no tags at all any more
#     (UNAUTHORIZED; Hub reports "object not found", while a control repository
#     lists 1977). MinIO publishes to quay.io, which this proxy blocks. The
#     artifact store is now SeaweedFS, which can be pinned. See ADR-0053.
#   * grafana/grafana:11 — likewise did not exist and has been replaced with
#     13.2.2, which does.
# Resolving a digest is not pulling an image: nothing here has been run.
#
# UNRESOLVED means exactly that: nobody has resolved this image here. Inventing
# digest-shaped strings would produce a lock file that looks
# authoritative and is fiction. Run `docker/resolve-images.sh` on a machine with
# a daemon (or with crane/skopeo) to replace every UNRESOLVED with the real
# digest, review the diff, and commit it.
#
# plane is where the image runs: fabric, tenant, designer, or sandbox.

