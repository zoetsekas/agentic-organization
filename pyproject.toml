[project]
name = "orgagents"
version = "0.1.0"
description = "Organizational agentic system: hierarchy-aware agents, harnesses, sandboxes, sessions and a marketplace catalog."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3", "deepagents>=0.0.5"]
openai = ["openai-agents>=0.0.9"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
orgagents = "orgagents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
