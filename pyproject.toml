# mypy baseline: 262 errors in 58 modules when mypy was introduced.
# Each entry silences only the codes that module had; remove a code once
# the module is clean of it. Never add one.
[[tool.mypy.overrides]]
module = "orgagents.api"
disable_error_code = ["arg-type", "attr-defined", "union-attr"]

