"src/orgagents/runtime/__init__.py" = ["I001"]
"src/orgagents/runtime/a2a.py" = ["I001"]
"src/orgagents/runtime/engine.py" = ["F401", "I001"]
"src/orgagents/runtime/loader.py" = ["I001"]
"src/orgagents/runtime/worker.py" = ["I001"]
"src/orgagents/seed.py" = ["E501"]
"src/orgagents/spec/model.py" = ["E501"]
"tests/test_channel_bridge.py" = ["E741"]
"tests/test_designer_accessibility.py" = ["E501"]
"tests/test_designer_data_deployment.py" = ["F811"]
"tests/test_designer_palette_coverage.py" = ["E501"]
"tests/test_layout.py" = ["E501"]
