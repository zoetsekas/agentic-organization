[project]
name = "orgagents"
version = "0.1.0"
description = "Organizational agentic system: hierarchy-aware agents, harnesses, sandboxes, sessions and a marketplace catalog."
requires-python = ">=3.10"
# Upper bounds: a framework on a 0.x line may break its API on any minor
# release, and a 1.x one on the next major, so each is capped at the release
# line it was last tested against. Raising a cap is a tested change (re-run
# `make lock` and the suite), not a bump. The exact versions CI and the
# images install are in constraints.txt (docs/DEVELOPERS.md, "Dependencies").
dependencies = [
  "pydantic>=2.6,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  # Windows has no IANA time-zone database; `zoneinfo` needs this there.
  "tzdata; sys_platform == 'win32'",
  # Ed25519 approval tokens (ADR-0114): the issuer signs, workers verify.
  "cryptography>=42,<47",
]

[project.optional-dependencies]
# Pinned to the 1.x line: deep agents took `system_prompt`/`subagents` in
# their current shape from 0.7, and the adapter targets that API.
# Tested on langgraph 1.2, langchain-core 1.6, deepagents 0.7.18 and
# langchain-mcp-adapters 0.3.
langgraph = ["langgraph>=1.0,<2", "langchain-core>=1.0,<2", "deepagents>=0.7,<0.8",
             "langchain-mcp-adapters>=0.1,<0.4"]
# `Agent.as_tool` is how a sub-agent returns to its caller (ADR-0027).
openai = ["openai-agents>=0.2,<0.23"]
anthropic = ["anthropic>=0.40,<2"]
# The typed API client, `orgagents.client` (ADR-0115).
client = ["httpx>=0.27,<1"]
# `orgagents mcp designer|runtime` (ADR-0115). The floor is a 1.x with
# streamable HTTP and the HTTP request on a tool's context (bearer identity);
# tested on 1.30. Capped below 2 because a major version may change the FastMCP server API
# these are written against; raising the cap is a tested change, not a bump.
mcp = ["mcp>=1.10,<2", "httpx>=0.27,<1"]
# Agent-to-agent messaging between worker containers over NATS JetStream
# (ADR-0118); every generated agent image installs it. Tested on 2.16; capped
# below 3 because a major version may change the JetStream client API.
bus = ["nats-py>=2.7,<3"]
# The designer's relational store (ADR-0113): SQLAlchemy Core over psycopg 3
# against PostgreSQL. Capped below the next major versions, whose Core and
# driver APIs this is written against; raising a cap is a tested change.
postgres = ["sqlalchemy>=2,<3", "psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8.0", "httpx>=0.27,<1", "jsonschema>=4.20", "nats-py>=2.7,<3",
       "sqlalchemy>=2,<3", "psycopg[binary]>=3.1,<4",
       "pytest-xdist>=3.5", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11",
       "types-PyYAML"]
# The browser checks (scripts/*.py, `pytest -m e2e`). constraints.txt pins
# the exact version CI installs, and so the Chromium build it downloads.
browser = ["playwright>=1.40,<2"]

[project.scripts]
orgagents = "orgagents.cli:main"

# Extension points (ADR-0091). A third-party distribution declares its own
# entries under these groups and `pip install` is the whole installation step:
#
#   [project.entry-points."orgagents.targets"]
#   "acme:onprem" = "acme_orgagents.target:OnPremTarget"
#
#   [project.entry-points."orgagents.runtime_adapters"]
#   acme_framework = "acme_orgagents.runtime:AcmeAdapter"
#
#   [project.entry-points."orgagents.provider_profiles"]
#   openstack = "acme_orgagents.terraform:OPENSTACK_PROFILE"
#
# Each entry resolves to the implementation, or to a zero-argument factory
# returning one. Publishing a `descriptor` alongside it is what lets the
# designer offer the right fields for that provider.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orgagents.spec" = ["issue_catalog.yaml"]
"orgagents.persistence" = ["migrations/*.sql", "migrations/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: drives a real browser; skipped where Playwright or its browser is absent",
]

# Lint (ruff) and import order; `make lint` runs exactly what CI runs.
# Formatting is not enforced: reformatting the whole tree would bury every
# other change in the history. The rules are the correctness set (pyflakes,
# pycodestyle errors and warnings, bugbear) plus import sorting.
[tool.ruff]
target-version = "py310"
line-length = 100
# `examples/*/generated` is compiler output, checked in as evidence of it.
extend-exclude = [".claude", "build", "web", "examples/*/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
  # FastAPI's `Depends(...)`/`Query(...)` in defaults is the framework's idiom.
  "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["orgagents"]

# Types (mypy); `make types` runs exactly what CI runs. Lenient across the
# package, strict-ish where a wrong type is a wrong spec or a wrong row: the
# spec model, the metamodel, security and persistence. Errors present when
# mypy was introduced are the per-module baseline at the end of this file;
# shrink it, never grow it.
[tool.mypy]
python_version = "3.10"
files = ["src/orgagents"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "orgagents.spec.*",
  "orgagents.metamodel.*",
  "orgagents.security.*",
  "orgagents.persistence.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

# Baseline: ~100 findings in 38 files (mostly E501, E402), recorded when ruff was
# introduced. Shrink it; never grow it. New files get the full rule set.
[tool.ruff.lint.extend-per-file-ignores]
"examples/atlas/end_to_end_bank_gcp.py" = ["E402"]
"examples/ayc/chat/server.py" = ["B905"]
"examples/ayc/end_to_end_operations.py" = ["F401", "F541", "I001"]
"examples/helios/end_to_end_pharma.py" = ["E402"]
"examples/sentinel/end_to_end.py" = ["E402"]
"scripts/concurrency_check.py" = ["E402", "E501", "E702"]
"scripts/interaction_check.py" = ["E402", "E501", "E731"]
"scripts/screenshots.py" = ["E402", "E501"]
"src/orgagents/api.py" = ["B904", "E731"]
"src/orgagents/compiler/diff.py" = ["B905"]
"src/orgagents/compiler/registry.py" = ["E501"]
"src/orgagents/compiler/targets/local.py" = ["F841", "I001"]
"src/orgagents/compiler/targets/terraform.py" = ["E501"]
"src/orgagents/designer/auth.py" = ["B905"]
"src/orgagents/designer/service.py" = ["E501"]
"src/orgagents/fabric/rbac.py" = ["E501"]
