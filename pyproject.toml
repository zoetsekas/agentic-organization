[project]
name = "orgagents"
version = "0.1.0"
description = "Organizational agentic system: hierarchy-aware agents, harnesses, sandboxes, sessions and a marketplace catalog."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  # Ed25519 approval tokens (ADR-0114): the issuer signs, workers verify.
  "cryptography>=42,<47",
]

[project.optional-dependencies]
# Pinned to the 1.x line: deep agents took `system_prompt`/`subagents` in
# their current shape from 0.7, and the adapter targets that API.
langgraph = ["langgraph>=1.0", "langchain-core>=1.0", "deepagents>=0.7",
             "langchain-mcp-adapters>=0.1"]
# `Agent.as_tool` is how a sub-agent returns to its caller (ADR-0027).
openai = ["openai-agents>=0.2"]
anthropic = ["anthropic>=0.40"]
# The typed API client, `orgagents.client` (ADR-0115).
client = ["httpx>=0.27,<1"]
# `orgagents mcp designer|runtime` (ADR-0115). The floor is a 1.x with
# streamable HTTP and the HTTP request on a tool's context (bearer identity);
# tested on 1.30. Capped below 2 because a major version may change the FastMCP server API
# these are written against; raising the cap is a tested change, not a bump.
mcp = ["mcp>=1.10,<2", "httpx>=0.27,<1"]
# Agent-to-agent messaging between worker containers over NATS JetStream
# (ADR-0118); every generated agent image installs it. Tested on 2.16; capped
# below 3 because a major version may change the JetStream client API.
bus = ["nats-py>=2.7,<3"]
# The designer's relational store (ADR-0113): SQLAlchemy Core over psycopg 3
# against PostgreSQL. Capped below the next major versions, whose Core and
# driver APIs this is written against; raising a cap is a tested change.
postgres = ["sqlalchemy>=2,<3", "psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8.0", "httpx>=0.27", "jsonschema>=4.20", "nats-py>=2.7,<3",
       "sqlalchemy>=2,<3", "psycopg[binary]>=3.1,<4"]

[project.scripts]
orgagents = "orgagents.cli:main"

# Extension points (ADR-0091). A third-party distribution declares its own
# entries under these groups and `pip install` is the whole installation step:
#
#   [project.entry-points."orgagents.targets"]
#   "acme:onprem" = "acme_orgagents.target:OnPremTarget"
#
#   [project.entry-points."orgagents.runtime_adapters"]
#   acme_framework = "acme_orgagents.runtime:AcmeAdapter"
#
#   [project.entry-points."orgagents.provider_profiles"]
#   openstack = "acme_orgagents.terraform:OPENSTACK_PROFILE"
#
# Each entry resolves to the implementation, or to a zero-argument factory
# returning one. Publishing a `descriptor` alongside it is what lets the
# designer offer the right fields for that provider.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orgagents.spec" = ["issue_catalog.yaml"]
"orgagents.persistence" = ["migrations/*.sql", "migrations/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: drives a real browser; skipped where Playwright or its browser is absent",
]
