name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'

      # ADR-0001: a dangling record reference is a build failure.
      - name: Validate decision and workstream records
        run: orgagents records validate

      - name: Check record indexes are current
        run: |
          orgagents records index
          git diff --exit-code docs/decisions/index.md docs/workstreams/index.md

      # ADR-0004: every shipped example spec must stay valid and neutral.
      # Examples live one per folder under examples/<name>/ (ADR-0085 era).
      - name: Validate every example system spec
        run: |
          for spec in examples/*/*.system.yaml; do
            echo "== $spec"
            orgagents spec validate "$spec"
          done

      # ADR-0019: both phases must be complete before anything compiles.
      - name: Check definition and implementation phases
        run: |
          for target in local terraform:gcp terraform:aws terraform:azure; do
            orgagents phase examples/acme/acme.system.yaml \
              --binding examples/acme/acme.binding.yaml --target "$target"
          done

      - name: Compile every target
        run: |
          orgagents compile examples/acme/acme.system.yaml \
            --binding examples/acme/acme.binding.yaml \
            --target local --target terraform:gcp \
            --target terraform:aws --target terraform:azure \
            --out build

      - name: Tests
        run: pytest -q

      # A browser is the only thing that presses the buttons. Two defects have
      # now shipped through a fully green suite — a view whose loader was keyed
      # by an id that no longer existed, and an agent form writing a spec key
      # ADR-0082 replaced — because every test asserted over JSON or over the
      # bundle as text, and nothing ever clicked Save. These scripts are how
      # that stops.
      - name: Install a browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Render every view
        run: python3 scripts/screenshots.py

      - name: Drive the canvas
        run: python3 scripts/interaction_check.py

      - name: Drive every view's own controls
        run: python3 scripts/view_check.py

      # The screenshots in the README are evidence, so a change that alters
      # them should show up in a diff rather than leaving the docs describing
      # a UI that has moved.
      - name: Screenshots are current
        run: git diff --stat docs/images || true
