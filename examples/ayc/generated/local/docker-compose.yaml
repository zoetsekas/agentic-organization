# Do not edit: this file is regenerated on every compile. Put customizations in overlays/.

name: ayc
services:
  state:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${STATE_PASSWORD}
      POSTGRES_DB: orgagents
    networks:
    - control
    volumes:
    - state-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d orgagents
      interval: 10s
      timeout: 3s
      retries: 5
  telemetry:
    image: otel/opentelemetry-collector-contrib:0.110.0
    networks:
    - control
  artifacts:
    image: chrislusf/seaweedfs:3.97
    command:
    - server
    - -dir=/data
    - -s3
    environment:
      MINIO_ROOT_USER: ${ARTIFACTS_USER}
      MINIO_ROOT_PASSWORD: ${ARTIFACTS_PASSWORD}
    networks:
    - control
    volumes:
    - artifacts-data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:9333/cluster/status
      interval: 10s
      timeout: 3s
      retries: 5
  nats:
    image: nats:2.15.0-alpine
    command:
    - --jetstream
    - --store_dir
    - /data
    - --name
    - bus
    - --http_port
    - '8222'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8222/healthz
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
    - control
    volumes:
    - bus-data:/data
    labels:
      org.agentic.subject_prefix: orgagents.local
      org.agentic.tenant: ''
  designer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ayc/platform:1.4.0
    command:
    - orgagents
    - serve
    - --host
    - 0.0.0.0
    environment:
      ORGAGENTS_DESIGNER_AUTH: none
    ports:
    - 127.0.0.1:8000:8000
    networks:
    - control
    - ingress
    depends_on:
    - state
  agent-ceo_agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ayc/agent-ceo_agent:1.4.0
    command:
    - orgagents
    - worker
    - ceo_agent
    environment:
      ORGAGENTS_AGENT_ID: ceo_agent
      ORGAGENTS_MANIFEST: /app/agents/ceo_agent.json
      ORGAGENTS_ADAPTER: langchain_deepagents
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4317
      ORGAGENTS_BUS: ${ORGAGENTS_BUS:-in_process}
      ORGAGENTS_BUS_URL: nats://nats:4222
      ORGAGENTS_BUS_SUBJECT_PREFIX: orgagents.local
      ORGAGENTS_WORKER_TOKEN: ${ORGAGENTS_WORKER_TOKEN_CEO_AGENT}
      ORGAGENTS_APPROVAL_PUBLIC_KEYS: ${ORGAGENTS_APPROVAL_PUBLIC_KEYS}
      ORGAGENTS_STATE_DIR: /var/lib/orgagents
    volumes:
    - ./agents:/app/agents:ro
    - agent-state-ceo_agent:/var/lib/orgagents
    networks:
    - control
    - isolated
    depends_on:
    - state
    - nats
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 256
    read_only: true
    cap_drop: &id001
    - ALL
    security_opt: &id002
    - no-new-privileges:true
    tmpfs:
    - /tmp
    labels:
      org.agentic.tenant: ''
      org.agentic.team: ayc
      org.agentic.placement: ''
      org.agentic.network_posture: none
      org.agentic.identity: id-ceo_agent
