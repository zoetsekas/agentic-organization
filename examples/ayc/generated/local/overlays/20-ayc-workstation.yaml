# AYC on a workstation (ADR-0109): what the generated stack cannot know.
#
# Everything above this folder is compiled from ayc.system.yaml and
# ayc.local.binding.yaml and is rewritten on every compile; this file is not.
# It changes the *deployment*, never the design: no agent gains a network, a
# credential or a tool here. What it does:
#
#   1. Swaps each backing system's image for the AYC mock of it
#      (examples/ayc/mocks), and publishes each mock's state on a port of its
#      own — through a network the mocks share with nobody else, so publishing
#      a port does not give an agent a route it did not have.
#   2. Adds the chat window (examples/ayc/chat), on `control` only: it can ask
#      an agent to act and cannot reach a system to act for one.
#   3. Moves the host ports off 8000, which the designer already uses on
#      this machine, and publishes every port on 127.0.0.1 only (ADR-0114).
#      Each port is `${AYC_PORT_<NAME>:-default}`, and the images the overlay
#      builds are named under `${AYC_IMAGE_PREFIX:-ayc-local}`, so a second
#      copy of the stack (`local_stack.py --project ayc-msg --port-base 19000`)
#      can run beside this one without touching its ports or its images;
#      telemetry is not published at all. The fabric uses 4317 here; the
#      fabric already use on this machine.
#   4. Swaps the flow engine for the mock of its run API (ADR-0110).
#   5. Parks the two services that have no command to run yet, rather than
#      leaving them crash-looping: `memory` (`orgagents memory serve` does not
#      exist) and `scheduler` (it runs a trigger's agent inside its own
#      process, i.e. outside that agent's container, networks and
#      credentials — the opposite of what the rest of this stack enforces).
#      `docker compose --profile parked up` starts them anyway.
#
# Paths are relative to the project directory (generated/local), which is how
# Compose resolves them for every file in the -f chain.

x-mock: &mock
  build:
    context: ../../mocks
  image: ${AYC_IMAGE_PREFIX:-ayc-local}/mock-system:dev
  command: ["python", "server.py"]
  # Hardened like the agents (ADR-0114): the mocks keep their state in memory.
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128

services:
  designer:
    ports: !override
      - "127.0.0.1:${AYC_PORT_DESIGNER:-18000}:8000"

  memory:
    profiles: [parked]
  scheduler:
    profiles: [parked]

  mcp-shopify:
    <<: *mock
    environment:
      MOCK_SYSTEM: shopify
    networks: [srv-shopify, mocks-admin]
    ports: ["127.0.0.1:${AYC_PORT_SHOPIFY:-18101}:8080"]
  mcp-fishbowl:
    <<: *mock
    environment:
      MOCK_SYSTEM: fishbowl
    networks: [srv-fishbowl, mocks-admin]
    ports: ["127.0.0.1:${AYC_PORT_FISHBOWL:-18102}:8080"]
  mcp-accounting:
    <<: *mock
    environment:
      MOCK_SYSTEM: accounting
    networks: [srv-accounting, mocks-admin]
    ports: ["127.0.0.1:${AYC_PORT_ACCOUNTING:-18103}:8080"]
  mcp-cms:
    <<: *mock
    environment:
      MOCK_SYSTEM: cms
    networks: [srv-cms, mocks-admin]
    ports: ["127.0.0.1:${AYC_PORT_CMS:-18104}:8080"]
  mcp-deploy_pipeline:
    <<: *mock
    environment:
      MOCK_SYSTEM: deploy_pipeline
    networks: [srv-deploy_pipeline, mocks-admin]
    ports: ["127.0.0.1:${AYC_PORT_DEPLOY_PIPELINE:-18105}:8080"]

  # The tenant's flow engine (ADR-0056, ADR-0110), swapped for the mock of its
  # run API so a workstation need not pull the engine's image. It stays on
  # `egress` only, where the generated stack put it, and answers there as
  # flows.internal, the host finance_ops allowlists; an agent with network
  # none shares no network with it. Its flows are published on 17860 so the
  # designer's *Open in* link has somewhere to land.
  langflow:
    <<: *mock
    environment:
      MOCK_SYSTEM: langflow
      MOCK_PORT: "7860"
    networks:
      egress:
        aliases: [flows.internal]
      mocks-admin: {}
    ports: ["127.0.0.1:${AYC_PORT_LANGFLOW:-17860}:7860"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7860/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

  chat:
    build:
      context: ../../chat
    image: ${AYC_IMAGE_PREFIX:-ayc-local}/chat:dev
    environment:
      CHAT_IR: /app/system.ir.json
      CHAT_WORKER_URL: "http://agent-{agent}:8000"
      CHAT_SYSTEM_LINKS: >-
        shopify=http://127.0.0.1:${AYC_PORT_SHOPIFY:-18101}/state,fishbowl=http://127.0.0.1:${AYC_PORT_FISHBOWL:-18102}/state,accounting=http://127.0.0.1:${AYC_PORT_ACCOUNTING:-18103}/state,cms=http://127.0.0.1:${AYC_PORT_CMS:-18104}/state,deploy_pipeline=http://127.0.0.1:${AYC_PORT_DEPLOY_PIPELINE:-18105}/state
      # The issuer of approvals and the caller of every worker (ADR-0114):
      # the Ed25519 private key approvals are signed with (the only copy --
      # workers get the public key), each worker's service token, and each
      # person's sign-in passcode. No agent holds any of these but its own
      # token.
      ORGAGENTS_APPROVAL_SIGNING_KEY: ${ORGAGENTS_APPROVAL_SIGNING_KEY}
      ORGAGENTS_WORKER_TOKEN_CEO_AGENT: ${ORGAGENTS_WORKER_TOKEN_CEO_AGENT}
      ORGAGENTS_WORKER_TOKEN_COO_AGENT: ${ORGAGENTS_WORKER_TOKEN_COO_AGENT}
      ORGAGENTS_WORKER_TOKEN_BUYER_AGENT: ${ORGAGENTS_WORKER_TOKEN_BUYER_AGENT}
      ORGAGENTS_WORKER_TOKEN_WAREHOUSE_AGENT: ${ORGAGENTS_WORKER_TOKEN_WAREHOUSE_AGENT}
      ORGAGENTS_WORKER_TOKEN_INVENTORY_AGENT: ${ORGAGENTS_WORKER_TOKEN_INVENTORY_AGENT}
      ORGAGENTS_WORKER_TOKEN_AP_AGENT: ${ORGAGENTS_WORKER_TOKEN_AP_AGENT}
      ORGAGENTS_WORKER_TOKEN_AR_AGENT: ${ORGAGENTS_WORKER_TOKEN_AR_AGENT}
      ORGAGENTS_WORKER_TOKEN_SOFTWARE_AGENT: ${ORGAGENTS_WORKER_TOKEN_SOFTWARE_AGENT}
      ORGAGENTS_WORKER_TOKEN_CGO_AGENT: ${ORGAGENTS_WORKER_TOKEN_CGO_AGENT}
      ORGAGENTS_WORKER_TOKEN_ECOMMERCE_AGENT: ${ORGAGENTS_WORKER_TOKEN_ECOMMERCE_AGENT}
      ORGAGENTS_WORKER_TOKEN_CS_AGENT: ${ORGAGENTS_WORKER_TOKEN_CS_AGENT}
      ORGAGENTS_WORKER_TOKEN_MARKETING_AGENT: ${ORGAGENTS_WORKER_TOKEN_MARKETING_AGENT}
      CHAT_PASSCODE_P_CEO: ${CHAT_PASSCODE_P_CEO}
      CHAT_PASSCODE_P_COO: ${CHAT_PASSCODE_P_COO}
      CHAT_PASSCODE_P_CGO: ${CHAT_PASSCODE_P_CGO}
      CHAT_PASSCODE_P_BUYER: ${CHAT_PASSCODE_P_BUYER}
      CHAT_PASSCODE_P_WAREHOUSE: ${CHAT_PASSCODE_P_WAREHOUSE}
      CHAT_PASSCODE_P_INVENTORY: ${CHAT_PASSCODE_P_INVENTORY}
      CHAT_PASSCODE_P_AP: ${CHAT_PASSCODE_P_AP}
      CHAT_PASSCODE_P_AR: ${CHAT_PASSCODE_P_AR}
      CHAT_PASSCODE_P_ECOM: ${CHAT_PASSCODE_P_ECOM}
      CHAT_PASSCODE_P_SALES: ${CHAT_PASSCODE_P_SALES}
    volumes:
      - ./system.ir.json:/app/system.ir.json:ro
    # `control` to reach the workers; `ingress` because a published port
    # needs a network with a gateway, and `control` has none (ADR-0114).
    networks: [control, ingress]
    ports: ["127.0.0.1:${AYC_PORT_CHAT:-18080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    labels:
      org.agentic.surface: chat

networks:
  # Only the mocks join this. It exists so their state can be published to the
  # host; no agent is attached to it.
  # Masquerading off: the host reaches the mocks' published ports, and on a
  # Linux engine the mocks reach nothing out through it. Docker Desktop still
  # routes it out (ADR-0114); no agent is on it either way.
  mocks-admin:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
