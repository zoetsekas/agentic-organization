# Binding for acme.system.yaml — the only place implementation choices live.
# Swapping providers or agent frameworks is a change to THIS file, not the spec.
spec: acme
version: "0.3.0"

targets:
  - target: local
    model:
      # The default satisfies the system policy (balanced, under the cost
      # ceiling). Agents whose policy asks for more are overridden below.
      provider: anthropic
      model: claude-sonnet-5
      subagent_model: claude-haiku-4-5-20251001
    runtime:
      adapter: echo          # langchain_deepagents | openai_agents_sdk | langgraph_native
    infrastructure:
      provider: local
      region: local
    environments:
      - {environment: reasoning, image: "python:3.11-slim", cpu: "0.25", memory: "256Mi"}
      - {environment: analysis, image: "python:3.11", cpu: "2", memory: "8Gi",
         packages: [pandas, numpy, pyarrow, duckdb]}
      - {environment: documents, image: "python:3.11", cpu: "1", memory: "4Gi",
         packages: [python-docx, openpyxl, pypdf]}
      - {environment: isolated_review, image: "python:3.11-slim", cpu: "1", memory: "4Gi"}
      - {environment: build, image: "ghcr.io/acme/agent-dev:3.11", cpu: "4", memory: "16Gi"}
      - {environment: integration, image: "python:3.11-slim", cpu: "1", memory: "2Gi",
         packages: [httpx, tenacity]}
    capabilities:
      - {capability: warehouse_query, server_name: warehouse, transport: stdio,
         command: orgagents-mcp-sql, engine: postgres, dsn_secret_ref: WAREHOUSE_DSN}
      - {capability: pii_reconciliation, server_name: customer_master, transport: stdio,
         command: orgagents-mcp-sql, engine: postgres, dsn_secret_ref: CUSTOMER_MASTER_DSN}
      - {capability: knowledge_contribute, server_name: knowledge, transport: http,
         url: "http://knowledge.internal/mcp"}
      - {capability: code_change, server_name: repo, transport: stdio,
         command: github-mcp-server, dsn_secret_ref: REPO_TOKEN}
      - {capability: incident_signal, server_name: telemetry, transport: http,
         url: "http://telemetry.internal/mcp"}
    channels:
      - {channel: incidents, provider: slack, workspace: acme, address: "#incidents",
         bot_identity_ref: SLACK_BOT_TOKEN}
      - {channel: finance_approvals, provider: msteams, workspace: acme.onmicrosoft.com,
         address: "Finance / Approvals", bot_identity_ref: TEAMS_BOT_ID}
      - {channel: change_review, provider: slack, workspace: acme,
         address: "#platform-change-review", bot_identity_ref: SLACK_BOT_TOKEN}
      - {channel: exec_briefing, provider: smtp, address: exec-briefing@acme.example,
         bot_identity_ref: SMTP_CREDENTIAL}
      - {channel: close_calendar, provider: internal, address: close-calendar}
    knowledge:
      - {knowledge: finance_handbook, provider: wiki, location: "https://wiki.acme.internal/finance",
         index: finance-handbook-v3, secret_ref: WIKI_TOKEN}
      - {knowledge: engineering_runbooks, provider: document_store,
         location: "https://docs.acme.internal/runbooks", index: runbooks-v7}
      - {knowledge: company_glossary, provider: wiki,
         location: "https://wiki.acme.internal/glossary", index: glossary-v1}
    scheduler:
      provider: internal
      queue: acme-triggers
      dead_letter: acme-triggers-dlq
      max_concurrency: 4
    memory:
      session_store: in_process
      long_term_store: relational
      index: acme-memory
    secrets_backend: environment
    observability_sink: otel_collector
    agent_overrides:
      # Routing the whole company is the one job that earns a frontier model.
      ceo: {model: {model: claude-opus-5}}
      analyst: {adapter: echo}

  - target: terraform
    model:
      provider: anthropic
      model: claude-sonnet-5
      subagent_model: claude-haiku-4-5-20251001
    runtime:
      adapter: langchain_deepagents
    infrastructure:
      provider: gcp
      region: europe-west1
      project: acme-agents-prod
      state_backend: acme-terraform-state
    environments:
      - {environment: reasoning, image: "europe-docker.pkg.dev/acme/agents/runtime:1",
         cpu: "0.25", memory: "512Mi"}
      - {environment: analysis, image: "europe-docker.pkg.dev/acme/agents/analysis:1",
         cpu: "2", memory: "8Gi"}
      - {environment: build, image: "europe-docker.pkg.dev/acme/agents/build:1",
         cpu: "4", memory: "16Gi"}
      - {environment: documents, image: "europe-docker.pkg.dev/acme/agents/documents:1",
         cpu: "1", memory: "4Gi"}
      - {environment: isolated_review,
         image: "europe-docker.pkg.dev/acme/agents/cleanroom:1", cpu: "1",
         memory: "4Gi", node_selector: {"confidential-computing": "true"}}
      - {environment: integration,
         image: "europe-docker.pkg.dev/acme/agents/integration:1", cpu: "1",
         memory: "2Gi"}
    capabilities:
      - {capability: warehouse_query, server_name: warehouse, transport: http,
         url: "https://mcp.acme.internal/warehouse", dsn_secret_ref: WAREHOUSE_DSN}
      - {capability: pii_reconciliation, server_name: customer_master, transport: http,
         url: "https://mcp.acme.internal/customer-master",
         dsn_secret_ref: CUSTOMER_MASTER_DSN}
      - {capability: knowledge_contribute, server_name: knowledge, transport: http,
         url: "https://mcp.acme.internal/knowledge"}
      - {capability: code_change, server_name: repo, transport: http,
         url: "https://mcp.acme.internal/repo", dsn_secret_ref: REPO_TOKEN}
      - {capability: incident_signal, server_name: telemetry, transport: http,
         url: "https://mcp.acme.internal/telemetry"}
    channels:
      - {channel: incidents, provider: slack, workspace: acme, address: "#incidents",
         bot_identity_ref: SLACK_BOT_TOKEN}
      - {channel: finance_approvals, provider: msteams,
         workspace: acme.onmicrosoft.com, address: "Finance / Approvals",
         bot_identity_ref: TEAMS_BOT_ID}
      - {channel: change_review, provider: slack, workspace: acme,
         address: "#platform-change-review", bot_identity_ref: SLACK_BOT_TOKEN}
      - {channel: exec_briefing, provider: smtp,
         address: exec-briefing@acme.example, bot_identity_ref: SMTP_CREDENTIAL}
    knowledge:
      - {knowledge: finance_handbook, provider: wiki,
         location: "https://wiki.acme.internal/finance", index: finance-handbook-v3,
         secret_ref: WIKI_TOKEN}
      - {knowledge: engineering_runbooks, provider: document_store,
         location: "https://docs.acme.internal/runbooks", index: runbooks-v7}
      - {knowledge: company_glossary, provider: wiki,
         location: "https://wiki.acme.internal/glossary", index: glossary-v1}
    scheduler:
      provider: cloud_scheduler
      queue: acme-triggers
      dead_letter: acme-triggers-dlq
      max_concurrency: 8
    memory:
      session_store: redis
      long_term_store: vector
      index: acme-memory
      embedding_model: text-embedding-3-large
      secret_ref: MEMORY_INDEX_KEY
    agent_overrides:
      ceo: {model: {model: claude-opus-5}}
    secrets_backend: secret_manager
    observability_sink: cloud_trace
