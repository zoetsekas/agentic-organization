# Atlas's binding: the vendor-neutral design met with Google's stack.
#
# This binding uses a **servers catalog** (ADR-0085): each enterprise system —
# the LOS, the CRM, the OMS, the risk system, the fincrime platform — is
# declared once under `servers:`, and each capability references it by `server`
# rather than repeating a URL and credential. The catalog is also the
# deployment's systems inventory, and the two sides of every separation sit on
# different servers on purpose, so a barrier decided in the spec survives into
# the wiring (ADR-0071); the phase gate checks it.
#
# The `adk` target runs the agents on Gemini via Vertex AI Agent Engine; the
# `terraform:gcp` target places the governed runtime — VPC, per-placement
# subnets and firewall — on Google Cloud (ADR-0084).
targets:
  - target: adk
    runtime:
      adapter: google_adk
    model:
      provider: google
      model: gemini-2.5-pro
      subagent_model: gemini-2.5-flash
    servers:
      - {id: los, kind: http_api, description: "Loan origination system", transport: http, url: "https://los.internal/mcp"}
      - {id: kyc, kind: http_api, description: "Know-your-customer / identity verification", transport: http, url: "https://kyc.internal/mcp"}
      - {id: crm, kind: database, description: "Customer records and servicing", engine: postgres, dsn_secret_ref: CRM_DSN}
      - {id: oms, kind: http_api, description: "Order management system (the trading floor)", transport: http, url: "https://oms.internal/mcp"}
      - {id: research_platform, kind: http_api, description: "Investment research publishing", transport: http, url: "https://research-platform.internal/mcp"}
      - {id: deal_platform, kind: http_api, description: "M&A / capital-markets deal room", transport: http, url: "https://deal-platform.internal/mcp"}
      - {id: control_room, kind: http_api, description: "Information-barrier control room", transport: http, url: "https://control-room.internal/mcp"}
      - {id: risk_system, kind: http_api, description: "Risk limits, VaR and breach control", transport: http, url: "https://risk-system.internal/mcp"}
      - {id: credit_system, kind: http_api, description: "Credit-risk approval", transport: http, url: "https://credit-system.internal/mcp"}
      - {id: fincrime_platform, kind: http_api, description: "Financial-crime case management", transport: http, url: "https://fincrime-platform.internal/mcp"}
      - {id: regulator_gateway, kind: http_api, description: "Regulator filing gateway (SARs)", transport: http, url: "https://regulator-gateway.internal/mcp"}
      - {id: audit_platform, kind: http_api, description: "Internal audit testing", transport: http, url: "https://audit-platform.internal/mcp"}
      - {id: deploy_pipeline, kind: http_api, description: "Production deployment pipeline", transport: http, url: "https://deploy-pipeline.internal/mcp"}
    capabilities:
      - {capability: loan_origination, server: los}
      - {capability: identity_verification, server: kyc}
      - {capability: transaction_trace, server: crm}
      - {capability: customer_lookup, server: crm}
      - {capability: trade_execution, server: oms}
      - {capability: position_query, server: oms}
      - {capability: research_publishing, server: research_platform}
      - {capability: deal_advisory, server: deal_platform}
      - {capability: wall_crossing, server: control_room}
      - {capability: limit_setting, server: risk_system}
      - {capability: risk_analytics_run, server: risk_system}
      - {capability: breach_override, server: risk_system}
      - {capability: credit_approval, server: credit_system}
      - {capability: aml_triage, server: fincrime_platform}
      - {capability: sar_filing, server: regulator_gateway}
      - {capability: audit_testing, server: audit_platform}
      - {capability: production_deploy, server: deploy_pipeline}
    environments:
      - {environment: clean_room, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: banking_ops, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: trading_floor, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: research_desk, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: deal_room, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: risk_analytics, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: fincrime_enclave, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: audit_room, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: build, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
      - {environment: deploy_runner, image: "python:3.12-slim", cpu: "2", memory: 4Gi}
    channels:
      - {channel: risk_desk, provider: google_chat, workspace: atlas, address: "spaces/risk", bot_identity_ref: CHAT_BOT_TOKEN}
      - {channel: control_room_escalations, provider: google_chat, workspace: atlas, address: "spaces/control-room", bot_identity_ref: CHAT_BOT_TOKEN}
    knowledge:
      - {knowledge: policy_library, provider: document_store, location: "gs://atlas-policy/library", index: policy-v3}
    memory:
      session_store: redis
      long_term_store: vector
      index: atlas-memory
      embedding_model: text-embedding-005
    scheduler:
      provider: cloud_scheduler
      queue: atlas-triggers
    secrets_backend: gcp_secret_manager
  - target: terraform:gcp
    runtime:
      adapter: langchain_deepagents
    model:
      provider: google
      model: gemini-2.5-pro
    infrastructure:
      provider: gcp
      region: europe-west1
      project: atlas-prod
      state_backend: gcs
    servers:
      - {id: los, kind: http_api, description: "Loan origination system", transport: http, url: "https://los.internal/mcp"}
      - {id: kyc, kind: http_api, description: "Know-your-customer / identity verification", transport: http, url: "https://kyc.internal/mcp"}
      - {id: crm, kind: database, description: "Customer records and servicing", engine: postgres, dsn_secret_ref: CRM_DSN}
      - {id: oms, kind: http_api, description: "Order management system (the trading floor)", transport: http, url: "https://oms.internal/mcp"}
      - {id: research_platform, kind: http_api, description: "Investment research publishing", transport: http, url: "https://research-platform.internal/mcp"}
      - {id: deal_platform, kind: http_api, description: "M&A / capital-markets deal room", transport: http, url: "https://deal-platform.internal/mcp"}
      - {id: control_room, kind: http_api, description: "Information-barrier control room", transport: http, url: "https://control-room.internal/mcp"}
      - {id: risk_system, kind: http_api, description: "Risk limits, VaR and breach control", transport: http, url: "https://risk-system.internal/mcp"}
      - {id: credit_system, kind: http_api, description: "Credit-risk approval", transport: http, url: "https://credit-system.internal/mcp"}
      - {id: fincrime_platform, kind: http_api, description: "Financial-crime case management", transport: http, url: "https://fincrime-platform.internal/mcp"}
      - {id: regulator_gateway, kind: http_api, description: "Regulator filing gateway (SARs)", transport: http, url: "https://regulator-gateway.internal/mcp"}
      - {id: audit_platform, kind: http_api, description: "Internal audit testing", transport: http, url: "https://audit-platform.internal/mcp"}
      - {id: deploy_pipeline, kind: http_api, description: "Production deployment pipeline", transport: http, url: "https://deploy-pipeline.internal/mcp"}
    capabilities:
      - {capability: loan_origination, server: los}
      - {capability: identity_verification, server: kyc}
      - {capability: transaction_trace, server: crm}
      - {capability: customer_lookup, server: crm}
      - {capability: trade_execution, server: oms}
      - {capability: position_query, server: oms}
      - {capability: research_publishing, server: research_platform}
      - {capability: deal_advisory, server: deal_platform}
      - {capability: wall_crossing, server: control_room}
      - {capability: limit_setting, server: risk_system}
      - {capability: risk_analytics_run, server: risk_system}
      - {capability: breach_override, server: risk_system}
      - {capability: credit_approval, server: credit_system}
      - {capability: aml_triage, server: fincrime_platform}
      - {capability: sar_filing, server: regulator_gateway}
      - {capability: audit_testing, server: audit_platform}
      - {capability: production_deploy, server: deploy_pipeline}
    environments:
      - {environment: clean_room, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: banking_ops, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: trading_floor, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: research_desk, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: deal_room, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: risk_analytics, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: fincrime_enclave, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: audit_room, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: build, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
      - {environment: deploy_runner, image: "us-docker.pkg.dev/atlas/agents/base:py312", cpu: "2", memory: 4Gi}
    channels:
      - {channel: risk_desk, provider: google_chat, workspace: atlas, address: "spaces/risk", bot_identity_ref: CHAT_BOT_TOKEN}
      - {channel: control_room_escalations, provider: google_chat, workspace: atlas, address: "spaces/control-room", bot_identity_ref: CHAT_BOT_TOKEN}
    knowledge:
      - {knowledge: policy_library, provider: document_store, location: "gs://atlas-policy/library", index: policy-v3}
    memory:
      session_store: redis
      long_term_store: vector
      index: atlas-memory
      embedding_model: text-embedding-005
    scheduler:
      provider: cloud_scheduler
