# Northwind Trading — the CFO organization, modelled to test this platform
# against a real enterprise shape rather than a convenient one.
#
# The structure follows the conventional split: Controllership owns the
# historical numbers (close, reporting, controls), FP&A owns the forward look,
# Treasury owns cash, Tax owns compliance. Internal Audit deliberately does
# **not** report to the CFO — its independence is the point, and an org model
# that cannot express that cannot model a finance function.
#
# The control this example exists to exercise is segregation of duties: the
# agent that raises a payment must not be the one that approves it, and neither
# may be the one that releases it.

metadata:
  name: northwind
  spec_version: "1.2.0"
  version: "0.1.0"
  description: Northwind's finance function as an agentic organization.
  owner: Northwind Platform Team
  environment: development

data_classes:
  - id: public_knowledge
    description: Policies, calendars and glossaries any agent may read.
    scope: public
  - id: ledger
    description: The general ledger, sub-ledgers and journal entries.
    scope: protected
    groups: [controllership]
    allowed_environments: [analysis]
  - id: payments
    description: Payment runs, bank instructions and vendor bank details.
    scope: protected
    groups: [treasury]
    allowed_environments: [payments_isolated]
  - id: vendor_master
    description: Vendor records, including bank details. A fraud surface.
    scope: protected
    groups: [controllership]
    allowed_environments: [analysis]
    may_appear_in_traces: false
  - id: forecast
    description: Plans, forecasts and the assumptions behind them.
    scope: protected
    groups: [fpa]
    allowed_environments: [analysis]
  - id: audit_findings
    description: Internal Audit's working papers and findings.
    scope: protected
    groups: [audit]
    allowed_environments: [analysis]

# What Northwind's units may *decide*, as against what they may reach.
decisions:
  - id: raise_payment
    title: Raise a payment
    description: Enter an invoice and propose it for payment.
  - id: approve_invoice
    title: Approve an invoice for payment
    description: Confirm an invoice is owed, correct and coded.
  - id: release_payment
    title: Release a payment to the bank
    description: Instruct the bank. The last point before money moves.
  - id: change_vendor_master
    title: Change a vendor record
    description: Including bank details. The classic fraud pairing with raise_payment.
  - id: post_journal_entry
    title: Post a journal entry
  - id: close_period
    title: Close an accounting period
  - id: publish_forecast
    title: Publish a forecast outside the team that made it
  - id: file_tax_return
    title: File a return with a tax authority
  - id: open_audit_finding
    title: Open or close an audit finding
  - id: write_off_receivable
    title: Write off a receivable
    description: Declare a customer debt uncollectable.
  - id: publish_statements
    title: Publish financial statements
    description: Issue the balance sheet, P&L and cash flow outside the company.
  - id: approve_budget
    title: Approve a budget
  - id: approve_capex
    title: Approve capital expenditure
    description: Commit to a long-term asset or project.
  - id: raise_debt
    title: Raise debt or change a credit line
  - id: place_investment
    title: Place surplus cash in an instrument
  - id: execute_hedge
    title: Execute a hedge against rate or currency exposure

# Decisions no single agent may hold together (ADR-0070). This is the control
# a finance function is built around, and it is the one thing hierarchical
# narrowing cannot express on its own: without these, every leader holds the
# union of everything beneath it.
separations:
  - id: payment_control
    decisions: [raise_payment, approve_invoice, release_payment]
    reason: >-
      One principal that can raise an invoice, approve it and instruct the bank
      can pay a supplier that does not exist. Committing the fraud must require
      collusion.
  - id: vendor_and_payment
    decisions: [change_vendor_master, raise_payment]
    reason: >-
      Changing a vendor's bank details and raising a payment to it is the
      classic pairing; either alone is recoverable.
  - id: audit_independence
    decisions: [open_audit_finding, close_period]
    reason: >-
      Internal Audit tests the close. An agent that can both close a period and
      settle the finding against it is auditing itself.

capabilities:
  - id: ledger_query
    description: Read-only queries against the general ledger.
    action: query
    resource_class: ledger_db
    data_classes: [ledger]
    constraints: {max_rows: 5000, allowed_operations: [select]}
  - id: journal_post
    description: Post a journal entry to the ledger.
    action: write
    resource_class: ledger_db
    data_classes: [ledger]
    decision: post_journal_entry
    constraints: {requires_approval: true}
  - id: invoice_entry
    description: Enter a supplier invoice into the payables ledger.
    action: write
    resource_class: payables
    data_classes: [ledger]
    decision: raise_payment
  - id: invoice_approval
    description: Approve an entered invoice for payment.
    action: approve
    resource_class: payables
    data_classes: [ledger]
    decision: approve_invoice
  - id: payment_release
    description: Instruct the bank to pay an approved run.
    action: write
    resource_class: banking
    data_classes: [payments]
    decision: release_payment
    constraints: {requires_approval: true}
  - id: vendor_maintenance
    description: Create or amend a vendor record.
    action: write
    resource_class: vendor_master
    data_classes: [vendor_master]
    decision: change_vendor_master
    constraints: {requires_approval: true}
  - id: forecast_model
    description: Run and revise the planning model.
    action: write
    resource_class: planning
    data_classes: [forecast]
  - id: tax_filing
    description: Prepare and submit a statutory return.
    action: write
    resource_class: tax_portal
    data_classes: [ledger]
    decision: file_tax_return
    constraints: {requires_approval: true}
  - id: cash_application
    description: Apply an incoming receipt to an open invoice.
    action: write
    resource_class: receivables
    data_classes: [ledger]
  - id: receivable_writeoff
    description: Write off an uncollectable debt.
    action: write
    resource_class: receivables
    data_classes: [ledger]
    decision: write_off_receivable
    constraints: {requires_approval: true}
  - id: statement_production
    description: Assemble the statutory financial statements from the ledger.
    action: write
    resource_class: reporting
    data_classes: [ledger]
    decision: publish_statements
    constraints: {requires_approval: true}
  - id: cash_position
    description: Read balances and forecast the daily cash position.
    action: query
    resource_class: banking
    data_classes: [payments]
    constraints: {allowed_operations: [select]}
  - id: debt_facility
    description: Draw, repay or amend a credit facility.
    action: write
    resource_class: banking
    data_classes: [payments]
    decision: raise_debt
    constraints: {requires_approval: true}
  - id: investment_placement
    description: Place surplus cash in a money-market instrument.
    action: write
    resource_class: banking
    data_classes: [payments]
    decision: place_investment
    constraints: {requires_approval: true}
  - id: hedge_execution
    description: Execute an FX or rate hedge against a declared exposure.
    action: write
    resource_class: banking
    data_classes: [payments]
    decision: execute_hedge
    constraints: {requires_approval: true}
  - id: budget_model
    description: Set and revise department spending targets.
    action: write
    resource_class: planning
    data_classes: [forecast]
    decision: approve_budget
  - id: scenario_model
    description: Run a what-if against the plan. Analysis, not a decision.
    action: write
    resource_class: planning
    data_classes: [forecast]
  - id: deal_analysis
    description: Model an acquisition or disposal. Advisory only.
    action: query
    resource_class: planning
    data_classes: [forecast, ledger]
    constraints: {max_rows: 5000, allowed_operations: [select]}
  - id: capex_register
    description: Record and track approved capital projects.
    action: write
    resource_class: planning
    data_classes: [ledger]
    decision: approve_capex
    constraints: {requires_approval: true}
  - id: controls_testing
    description: Sample transactions and test a control.
    action: query
    resource_class: ledger_db
    data_classes: [ledger, payments, vendor_master]
    constraints: {max_rows: 2000, allowed_operations: [select]}

environments:
  - id: analysis
    description: Reasoning and query work against finance systems.
    toolchains: [data_analysis]
    tier: medium
    network: allowlist
    egress_allowlist: ["ledger.internal", "planning.internal"]
    mounts: [ledger, forecast]
    persistence: ephemeral
  - id: payments_isolated
    description: Payment instruction work. No general egress.
    toolchains: [scripting]
    tier: minimal
    network: allowlist
    egress_allowlist: ["bank-gateway.internal"]
    mounts: [payments]
    persistence: ephemeral

roles:
  - id: finance_leadership
    title: Finance leadership
    kind: team
    responsibilities:
      - Own the integrity of the numbers Northwind reports.
    permissions:
      - {action: read, resource_kind: data_class, resource: public_knowledge}
  - id: controllership_team
    title: Controllership
    kind: team
    responsibilities:
      - Close the books accurately and on the published calendar.
      - Keep the vendor master accurate and the payables ledger complete.
    capabilities: [ledger_query]
    permissions:
      - {action: read, resource_kind: data_class, resource: ledger}
      - {action: query, resource_kind: capability, resource: ledger_query}
      - {action: read, resource_kind: data_class, resource: public_knowledge}
  - id: payables_clerk
    title: Payables clerk
    responsibilities:
      - Enter supplier invoices and match them to purchase orders.
    capabilities: [invoice_entry, ledger_query]
    permissions:
      - {action: write, resource_kind: capability, resource: invoice_entry}
      - {action: query, resource_kind: capability, resource: ledger_query}
  - id: financial_controller
    title: Financial controller
    responsibilities:
      - Approve invoices for payment and own the close.
    capabilities: [invoice_approval, journal_post, ledger_query, vendor_maintenance]
    permissions:
      - {action: approve, resource_kind: capability, resource: invoice_approval}
      - {action: write, resource_kind: capability, resource: journal_post}
      - {action: write, resource_kind: capability, resource: vendor_maintenance}
      - {action: query, resource_kind: capability, resource: ledger_query}
      - {action: delegate, resource_kind: agent, resource: "*"}
  - id: treasury_team
    title: Treasury
    kind: team
    responsibilities:
      - Hold the cash position and release approved payment runs.
    capabilities: [payment_release]
    permissions:
      - {action: read, resource_kind: data_class, resource: payments}
      - {action: write, resource_kind: capability, resource: payment_release}
  - id: fpa_team
    title: Financial planning and analysis
    kind: team
    responsibilities:
      - Produce the forecast and explain the variance against it.
    capabilities: [forecast_model, ledger_query]
    permissions:
      - {action: read, resource_kind: data_class, resource: forecast}
      - {action: write, resource_kind: capability, resource: forecast_model}
      - {action: query, resource_kind: capability, resource: ledger_query}
  - id: tax_team
    title: Tax
    kind: team
    responsibilities:
      - File accurate returns on statutory deadlines.
    capabilities: [tax_filing, ledger_query]
    permissions:
      - {action: write, resource_kind: capability, resource: tax_filing}
      - {action: query, resource_kind: capability, resource: ledger_query}
  - id: receivables_clerk
    title: Receivables clerk
    responsibilities:
      - Apply incoming receipts and chase overdue customer debt.
    capabilities: [cash_application, receivable_writeoff, ledger_query]
    permissions:
      - {action: write, resource_kind: capability, resource: cash_application}
      - {action: write, resource_kind: capability, resource: receivable_writeoff}
      - {action: query, resource_kind: capability, resource: ledger_query}
  - id: reporting_accountant
    title: Reporting accountant
    responsibilities:
      - Assemble the statutory financial statements from the closed ledger.
    capabilities: [statement_production, ledger_query]
    permissions:
      - {action: write, resource_kind: capability, resource: statement_production}
      - {action: query, resource_kind: capability, resource: ledger_query}
  - id: cash_manager
    title: Cash manager
    responsibilities:
      - Hold the daily cash position and keep the company liquid.
      - Place surplus cash and draw on facilities as the position requires.
    capabilities: [cash_position, debt_facility, investment_placement, hedge_execution]
    permissions:
      - {action: query, resource_kind: capability, resource: cash_position}
      - {action: write, resource_kind: capability, resource: debt_facility}
      - {action: write, resource_kind: capability, resource: investment_placement}
      - {action: write, resource_kind: capability, resource: hedge_execution}
  - id: planning_analyst
    title: Planning analyst
    responsibilities:
      - Set budgets, project revenue and cost, and model what-if scenarios.
    capabilities: [budget_model, scenario_model, forecast_model, ledger_query]
    permissions:
      - {action: write, resource_kind: capability, resource: budget_model}
      - {action: write, resource_kind: capability, resource: scenario_model}
      - {action: write, resource_kind: capability, resource: forecast_model}
      - {action: query, resource_kind: capability, resource: ledger_query}
  - id: corporate_development
    title: Corporate development
    responsibilities:
      - Analyse acquisitions, disposals and capital projects.
      - Recommend; the decision belongs to the board.
    capabilities: [deal_analysis, capex_register, scenario_model]
    permissions:
      - {action: query, resource_kind: capability, resource: deal_analysis}
      - {action: write, resource_kind: capability, resource: capex_register}
      - {action: write, resource_kind: capability, resource: scenario_model}
  - id: internal_audit_team
    title: Internal audit
    kind: team
    responsibilities:
      - Test the controls the finance function relies on.
      - Report to the audit committee, not to the function being tested.
    capabilities: [controls_testing]
    permissions:
      - {action: read, resource_kind: data_class, resource: audit_findings}
      - {action: query, resource_kind: capability, resource: controls_testing}

organization:
  id: northwind
  name: Northwind Trading
  description: The corporate centre.
  # No mandate: the root holds the declared vocabulary (ADR-0071). Enumerating
  # it here would mean editing this list every time a leaf gains a function.
  leader: ceo
  groups: [all_hands]
  members:
    - id: ceo
      name: chief-executive
      description: Arbitrates between functions and owns cross-function escalation.
      # Not the union of everything beneath: a chief executive who can raise,
      # approve and release a payment is the control's largest hole, and
      # separation 'payment_control' refuses the spec that leaves it open.
      mandate:
        decisions: [publish_forecast]
      humans:
        - user_id: u_ceo
          name: Ada Whitfield
          display_name: Ada Whitfield
          contact: ada.whitfield@northwind.example
          roles: [owner]
      environment: {environment: analysis}
  teams:
    - id: finance
      name: Finance
      description: The CFO's organization.
      leader: cfo
      groups: [finance]
      roles: [finance_leadership]
      members:
        - id: cfo
          name: chief-financial-officer
          description: Owns the numbers Northwind reports.
          # A CFO approves; a CFO does not enter invoices or instruct the bank.
          mandate:
            decisions: [approve_invoice, close_period, publish_forecast,
                        file_tax_return]
          humans:
            - user_id: u_cfo
              name: Marcus Oyelaran
              display_name: Marcus Oyelaran
              contact: marcus.oyelaran@northwind.example
              roles: [owner]
          environment: {environment: analysis}
      teams:
        - id: controllership
          name: Controllership
          description: Close, controls and the payables ledger.
          mandate:
            decisions: [raise_payment, approve_invoice, change_vendor_master,
                        post_journal_entry, close_period, write_off_receivable]
          leader: controller
          groups: [controllership]
          roles: [controllership_team]
          members:
            - id: controller
              name: financial-controller
              description: Approves invoices and owns the close.
              roles: [financial_controller]
              mandate:
                decisions: [approve_invoice, change_vendor_master,
                            post_journal_entry, close_period]
              humans:
                - user_id: u_controller
                  name: Reyna Castellanos
                  display_name: Reyna Castellanos
                  contact: reyna.castellanos@northwind.example
                  roles: [owner]
              environment: {environment: analysis}
            - id: payables
              name: accounts-payable
              description: Enters supplier invoices and matches them to orders.
              roles: [payables_clerk]
              mandate:
                decisions: [raise_payment]
              humans:
                - user_id: u_ap
                  name: Tomas Brandt
                  display_name: Tomas Brandt
                  contact: tomas.brandt@northwind.example
                  roles: [owner]
              environment: {environment: analysis}
            - id: receivables
              name: accounts-receivable
              description: Chases and applies customer receipts.
              roles: [receivables_clerk]
              mandate:
                decisions: [write_off_receivable]
              humans:
                - user_id: u_ar
                  name: Wen Li
                  display_name: Wen Li
                  contact: wen.li@northwind.example
                  roles: [owner]
              environment: {environment: analysis}
        - id: reporting
          name: Financial Reporting
          description: Turns the closed ledger into statements.
          mandate:
            decisions: [publish_statements]
          leader: reporting_lead
          groups: [controllership]
          roles: [controllership_team]
          members:
            - id: reporting_lead
              name: reporting-accountant
              description: Assembles and issues the statutory statements.
              roles: [reporting_accountant]
              humans:
                - user_id: u_report
                  name: Hana Svobodová
                  display_name: Hana Svobodová
                  contact: hana.svobodova@northwind.example
                  roles: [owner]
              environment: {environment: analysis}
        - id: treasury
          name: Treasury
          description: Cash, liquidity and the bank relationship.
          mandate:
            decisions: [release_payment, raise_debt, place_investment,
                        execute_hedge]
          leader: treasurer
          groups: [treasury]
          roles: [treasury_team]
          members:
            - id: treasurer
              name: treasurer
              description: Holds the cash position and releases approved runs.
              humans:
                - user_id: u_treas
                  name: Priya Raghunathan
                  display_name: Priya Raghunathan
                  contact: priya.raghunathan@northwind.example
                  roles: [owner]
              environment: {environment: payments_isolated}
            - id: cash_manager
              name: cash-manager
              description: Holds the daily position; draws, places and hedges.
              roles: [cash_manager]
              mandate:
                decisions: [raise_debt, place_investment, execute_hedge]
                # Declared, and — as it turns out — never evaluated.
                conditions:
                  max_facility_gbp: 5000000
                  max_placement_gbp: 2000000
              humans:
                - user_id: u_cash
                  name: Eero Lindqvist
                  display_name: Eero Lindqvist
                  contact: eero.lindqvist@northwind.example
                  roles: [owner]
              environment: {environment: payments_isolated}
        - id: fpa
          name: Financial Planning and Analysis
          description: The forward look.
          mandate:
            decisions: [publish_forecast, approve_budget]
          leader: fpa_lead
          groups: [fpa]
          roles: [fpa_team]
          members:
            - id: fpa_lead
              name: head-of-fpa
              description: Owns the plan, the budget and the variance story.
              roles: [planning_analyst]
              mandate:
                decisions: [publish_forecast, approve_budget]
              humans:
                - user_id: u_fpa
                  name: Sofia Marchetti
                  display_name: Sofia Marchetti
                  contact: sofia.marchetti@northwind.example
                  roles: [owner]
              environment: {environment: analysis}
        - id: tax
          name: Tax
          description: Statutory compliance.
          mandate:
            decisions: [file_tax_return]
          leader: tax_lead
          groups: [tax]
          roles: [tax_team]
          members:
            - id: tax_lead
              name: head-of-tax
              description: Prepares and files returns.
              humans:
                - user_id: u_tax
                  name: Idris Kovač
                  display_name: Idris Kovač
                  contact: idris.kovac@northwind.example
                  roles: [owner]
              environment: {environment: analysis}
    # Internal Audit reports to the audit committee, NOT to the CFO. Its
    # independence is the control; putting it under Finance would make the
    # function test itself.
    - id: corporate_development
      name: Corporate Development
      description: Analyses capital projects and transactions. Advises; does not decide.
      # Declaring nothing would INHERIT the root's mandate — every decision in
      # the company. "Recommends only" has to be written as an empty set.
      mandate:
        decisions: []
      leader: corpdev_lead
      groups: [finance]
      members:
        - id: corpdev_lead
          name: head-of-corporate-development
          description: Models acquisitions, disposals and capital projects.
          roles: [corporate_development]
          humans:
            - user_id: u_corpdev
              name: Anneke Visser
              display_name: Anneke Visser
              contact: anneke.visser@northwind.example
              roles: [owner]
          environment: {environment: analysis}
    - id: internal_audit
      name: Internal Audit
      description: Independent assurance over the finance function's controls.
      mandate:
        decisions: [open_audit_finding]
      leader: audit_lead
      groups: [audit]
      roles: [internal_audit_team]
      members:
        - id: audit_lead
          name: head-of-internal-audit
          description: Tests the controls the finance function relies on.
          humans:
            - user_id: u_audit
              name: Grace Nakamura
              display_name: Grace Nakamura
              contact: grace.nakamura@northwind.example
              roles: [owner]
          environment: {environment: analysis}

observability:
  traces: true
  metrics: true
  propagate_across_delegation: true
  retention_days: 90
  sample_rate: 1.0
  # Vendor bank details are the fraud surface; they never reach a trace.
  redact_data_classes: [vendor_master]

guardrails:
  - id: no_bank_details_outbound
    description: Vendor bank details must not leave on an outbound message.
    applies_to: [output, tool_output]
    checks: [data_class]
    data_classes: [vendor_master]
    on_violation: block
  - id: no_credentials_out
    description: Nothing credential-shaped leaves an agent, ever.
    applies_to: [output, tool_output]
    checks: [secrets]
    on_violation: block
  - id: screen_inbound_instructions
    description: Invoice text and vendor notes are somebody else's writing.
    applies_to: [input, tool_output]
    checks: [prompt_injection]
    on_violation: escalate
    escalate_channel: finance_escalations

channels:
  - id: finance_escalations
    description: Where a screened message goes for a human to look at.
    purpose: escalation
    members: [controller, cfo]
